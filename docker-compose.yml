version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: hunbei-server
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - server-data:/app/data
      - server-uploads:/app/uploads
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-please-change-this-secret}
      - ADMIN_PHONE=${ADMIN_PHONE:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
    env_file:
      - .env.docker
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: hunbei-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./admin/dist:/usr/share/nginx/html/admin:ro
      - ./server/uploads:/usr/share/nginx/uploads:ro
    depends_on:
      - server

volumes:
  server-data:
  server-uploads:
