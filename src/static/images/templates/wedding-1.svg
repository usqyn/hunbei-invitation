<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fff5f5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffe4e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffd4db;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d4a574;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#e6c9a8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4a574;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e84a6e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c44569;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="800" height="1200" fill="url(#bg1)"/>

  <!-- 装饰边框 -->
  <rect x="40" y="40" width="720" height="1120" fill="none" stroke="url(#gold1)" stroke-width="2" rx="12"/>
  <rect x="60" y="60" width="680" height="1080" fill="none" stroke="url(#gold1)" stroke-width="1" rx="10" opacity="0.5"/>

  <!-- 四角装饰花纹 -->
  <g transform="translate(80, 80)" opacity="0.7">
    <circle cx="0" cy="0" r="8" fill="#d4a574"/>
    <circle cx="15" cy="15" r="4" fill="#e84a6e"/>
    <circle cx="-15" cy="15" r="4" fill="#e84a6e"/>
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#d4a574" stroke-width="1"/>
    <line x1="0" y1="-30" x2="0" y2="30" stroke="#d4a574" stroke-width="1"/>
  </g>
  <g transform="translate(720, 80)" opacity="0.7">
    <circle cx="0" cy="0" r="8" fill="#d4a574"/>
    <circle cx="-15" cy="15" r="4" fill="#e84a6e"/>
    <circle cx="15" cy="15" r="4" fill="#e84a6e"/>
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#d4a574" stroke-width="1"/>
    <line x1="0" y1="-30" x2="0" y2="30" stroke="#d4a574" stroke-width="1"/>
  </g>
  <g transform="translate(80, 1120)" opacity="0.7">
    <circle cx="0" cy="0" r="8" fill="#d4a574"/>
    <circle cx="15" cy="-15" r="4" fill="#e84a6e"/>
    <circle cx="-15" cy="-15" r="4" fill="#e84a6e"/>
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#d4a574" stroke-width="1"/>
    <line x1="0" y1="-30" x2="0" y2="30" stroke="#d4a574" stroke-width="1"/>
  </g>
  <g transform="translate(720, 1120)" opacity="0.7">
    <circle cx="0" cy="0" r="8" fill="#d4a574"/>
    <circle cx="-15" cy="-15" r="4" fill="#e84a6e"/>
    <circle cx="15" cy="-15" r="4" fill="#e84a6e"/>
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#d4a574" stroke-width="1"/>
    <line x1="0" y1="-30" x2="0" y2="30" stroke="#d4a574" stroke-width="1"/>
  </g>

  <!-- 顶部装饰 -->
  <g transform="translate(400, 150)">
    <text x="0" y="0" text-anchor="middle" font-size="36" fill="#e84a6e">❀ ❀ ❀</text>
  </g>

  <!-- 囍字背景 -->
  <ellipse cx="400" cy="280" rx="120" ry="100" fill="#ffffff" opacity="0.6"/>
  
  <!-- 囍字 -->
  <text x="400" y="310" text-anchor="middle" font-size="140" fill="url(#redGrad)" font-family="STKaiti, KaiTi, serif" font-weight="bold">囍</text>

  <!-- 英文标题 -->
  <g transform="translate(400, 420)">
    <line x1="-120" y1="0" x2="-30" y2="0" stroke="#d4a574" stroke-width="1"/>
    <circle cx="0" cy="0" r="6" fill="#e84a6e"/>
    <line x1="30" y1="0" x2="120" y2="0" stroke="#d4a574" stroke-width="1"/>
  </g>
  <text x="400" y="450" text-anchor="middle" font-size="22" fill="#8b7355" letter-spacing="6" font-family="serif">WEDDING INVITATION</text>
  <text x="400" y="480" text-anchor="middle" font-size="18" fill="#a08060" letter-spacing="3" font-family="serif">OUR SPECIAL DAY</text>

  <!-- 主标题 -->
  <text x="400" y="580" text-anchor="middle" font-size="68" fill="#c44569" font-family="STKaiti, KaiTi, serif">我们结婚啦</text>
  
  <!-- 副标题 -->
  <text x="400" y="630" text-anchor="middle" font-size="24" fill="#8b7355" letter-spacing="4">Welcome to our wedding</text>

  <!-- 分隔装饰 -->
  <g transform="translate(400, 680)">
    <line x1="-180" y1="0" x2="-40" y2="0" stroke="#d4a574" stroke-width="1" opacity="0.6"/>
    <text x="0" y="6" text-anchor="middle" font-size="20" fill="#e84a6e">♥</text>
    <line x1="40" y1="0" x2="180" y2="0" stroke="#d4a574" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- 新人信息卡片 -->
  <g transform="translate(400, 780)">
    <rect x="-200" y="-80" width="400" height="200" fill="#ffffff" rx="16" opacity="0.85"/>
    <rect x="-180" y="-60" width="360" height="160" fill="none" stroke="#e84a6e" stroke-width="1" rx="12" opacity="0.4"/>
    
    <!-- 新郎 -->
    <text x="-120" y="-10" text-anchor="middle" font-size="40" fill="#333333" font-family="STKaiti, KaiTi, serif">满小满</text>
    <text x="-120" y="25" text-anchor="middle" font-size="18" fill="#999999" letter-spacing="4">GROOM</text>
    
    <!-- 心形分隔 -->
    <text x="0" y="10" text-anchor="middle" font-size="44" fill="#e84a6e">♥</text>
    
    <!-- 新娘 -->
    <text x="120" y="-10" text-anchor="middle" font-size="40" fill="#333333" font-family="STKaiti, KaiTi, serif">美小美</text>
    <text x="120" y="25" text-anchor="middle" font-size="18" fill="#999999" letter-spacing="4">BRIDE</text>
  </g>

  <!-- 婚礼日期 -->
  <g transform="translate(400, 1000)">
    <rect x="-140" y="-35" width="280" height="70" rx="35" fill="url(#redGrad)"/>
    <text x="0" y="10" text-anchor="middle" font-size="26" fill="#ffffff" font-weight="500">2050 / 05 / 20</text>
  </g>
  <text x="400" y="1060" text-anchor="middle" font-size="16" fill="#8b7355" letter-spacing="8">SATURDAY</text>

  <!-- 底部装饰文字 -->
  <g transform="translate(400, 1120)">
    <line x1="-100" y1="0" x2="-20" y2="0" stroke="#d4a574" stroke-width="1" opacity="0.4"/>
    <text x="0" y="5" text-anchor="middle" font-size="14" fill="#d4a574">❀</text>
    <line x1="20" y1="0" x2="100" y2="0" stroke="#d4a574" stroke-width="1" opacity="0.4"/>
  </g>
  <text x="400" y="1155" text-anchor="middle" font-size="22" fill="#8b7355" font-family="STKaiti, KaiTi, serif">执子之手 与子偕老</text>
</svg>
