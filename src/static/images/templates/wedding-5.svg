<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fff5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffe0e6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e84a6e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c44569;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="1200" fill="url(#bg5)"/>
  <circle cx="100" cy="100" r="80" fill="#e84a6e" opacity="0.08"/>
  <circle cx="700" cy="1100" r="120" fill="#e84a6e" opacity="0.06"/>
  <rect x="80" y="80" width="640" height="1040" rx="20" fill="none" stroke="url(#rose)" stroke-width="2" opacity="0.4"/>
  <rect x="120" y="120" width="560" height="960" rx="16" fill="none" stroke="url(#rose)" stroke-width="1" opacity="0.3"/>
