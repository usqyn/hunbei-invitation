  <text x="650" y="840" font-size="20" fill="#999999" text-anchor="end">BRIDE</text>
  
  <rect x="80" y="900" width="640" height="250" rx="20" fill="#ffffff" stroke="#cd853f" stroke-width="2"/>
  
  <rect x="100" y="920" width="600" height="210" rx="12" fill="#fffaf0"/>
  <text x="400" y="1020" font-size="40" fill="#cd853f" text-anchor="middle" font-family="STKaiti">爱，让我和你变成了我们</text>
  
  <text x="400" y="1180" font-size="24" fill="#cd853f" text-anchor="middle">❤️</text>
