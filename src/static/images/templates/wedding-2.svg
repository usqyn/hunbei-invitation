<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#faf7f2;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f5ebe0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e6d5c3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#b8956a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b7355;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cream" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#faf7f2;stop-opacity:0.9" />
    </linearGradient>
  </defs>

  <rect width="800" height="1200" fill="url(#bg2)"/>

  <!-- 装饰圆形背景 -->
  <circle cx="400" cy="180" r="140" fill="none" stroke="url(#gold2)" stroke-width="1" opacity="0.4"/>
  <circle cx="400" cy="180" r="110" fill="none" stroke="url(#gold2)" stroke-width="1" opacity="0.6"/>
  <circle cx="400" cy="180" r="80" fill="none" stroke="url(#gold2)" stroke-width="1" opacity="0.8"/>

  <!-- 顶部装饰图标 -->
  <text x="400" y="195" text-anchor="middle" font-size="44" fill="#8b7355">💍</text>

  <!-- 英文标题 -->
  <text x="400" y="320" text-anchor="middle" font-size="22" fill="#8b7355" letter-spacing="8" font-family="serif">O U R &nbsp; W E D D I N G</text>
  
  <!-- 分隔线 -->
  <g transform="translate(400, 360)">
    <line x1="-150" y1="0" x2="-40" y2="0" stroke="#8b7355" stroke-width="1" opacity="0.4"/>
    <text x="0" y="5" text-anchor="middle" font-size="16" fill="#b8956a">❀</text>
    <line x1="40" y1="0" x2="150" y2="0" stroke="#8b7355" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- 主标题 -->
  <text x="400" y="460" text-anchor="middle" font-size="64" fill="url(#gold2)" font-family="STKaiti, KaiTi, serif">浪漫婚礼</text>
  <text x="400" y="510" text-anchor="middle" font-size="20" fill="#a08060" letter-spacing="4">FOREVER TOGETHER</text>

  <!-- 内容卡片 -->
  <g transform="translate(400, 680)">
    <rect x="-260" y="-140" width="520" height="340" fill="url(#cream)" rx="20"/>
    <rect x="-240" y="-120" width="480" height="300" fill="none" stroke="url(#gold2)" stroke-width="1" rx="16" opacity="0.5"/>

    <!-- 新人信息 -->
    <g transform="translate(-120, -40)">
      <text x="0" y="0" text-anchor="middle" font-size="40" fill="#5c4033" font-family="STKaiti, KaiTi, serif">满小满</text>
      <text x="0" y="35" text-anchor="middle" font-size="16" fill="#8b7355" letter-spacing="3">T H E &nbsp; G R O O M</text>
    </g>
    
    <!-- & 符号 -->
    <text x="0" y="0" text-anchor="middle" font-size="56" fill="url(#gold2)" font-family="serif" font-style="italic">&amp;</text>
    
    <g transform="translate(120, -40)">
      <text x="0" y="0" text-anchor="middle" font-size="40" fill="#5c4033" font-family="STKaiti, KaiTi, serif">美小美</text>
      <text x="0" y="35" text-anchor="middle" font-size="16" fill="#8b7355" letter-spacing="3">T H E &nbsp; B R I D E</text>
    </g>

    <!-- 分隔线 -->
    <line x1="-200" y1="60" x2="200" y2="60" stroke="#d4a574" stroke-width="1" opacity="0.4"/>

    <!-- 日期 -->
    <text x="0" y="110" text-anchor="middle" font-size="26" fill="#8b7355" font-family="STKaiti, KaiTi, serif">婚礼日期</text>
    <text x="0" y="160" text-anchor="middle" font-size="42" fill="#5c4033" font-weight="500">2050 . 05 . 20</text>
    <text x="0" y="195" text-anchor="middle" font-size="16" fill="#a08060" letter-spacing="6">星期六 · SATURDAY</text>
  </g>

  <!-- 装饰分隔 -->
  <g transform="translate(400, 1000)">
    <line x1="-140" y1="0" x2="-50" y2="0" stroke="url(#gold2)" stroke-width="1" opacity="0.4"/>
    <text x="0" y="5" text-anchor="middle" font-size="16" fill="#d4a574">❀ ❀ ❀</text>
    <line x1="50" y1="0" x2="140" y2="0" stroke="url(#gold2)" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- 邀请语 -->
  <text x="400" y="1060" text-anchor="middle" font-size="24" fill="#8b7355" font-family="STKaiti, KaiTi, serif">诚挚邀请您的光临</text>
  <text x="400" y="1100" text-anchor="middle" font-size="16" fill="#a08060" letter-spacing="6">SINCERELY INVITE YOU</text>

  <!-- 底部装饰 -->
  <g transform="translate(400, 1150)">
    <line x1="-80" y1="0" x2="-20" y2="0" stroke="#d4a574" stroke-width="1" opacity="0.3"/>
    <text x="0" y="5" text-anchor="middle" font-size="14" fill="#b8956a">♡</text>
    <line x1="20" y1="0" x2="80" y2="0" stroke="#d4a574" stroke-width="1" opacity="0.3"/>
  </g>
</svg>
